{% extends 'admin_panel/base_admin.html' %}

{% block title %}{{ title }} — AI Text Generator{% endblock %}

{% block admin_content %}

<div class="glass-card p-4 text-center">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 2.5rem;"></i>
    <h3 class="mt-3">{{ title }}</h3>
    <p class="mb-1">Are you sure you want to delete <strong>{{ object_label }}</strong>?</p>
    <p class="text-muted">{{ warning }}</p>

    <form method="POST" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash"></i> Yes, Delete
        </button>
    </form>
    <a href="{% url cancel_url %}" class="btn btn-outline-secondary">Cancel</a>
</div>

{% endblock %}
