{% extends 'admin_panel/base_admin.html' %}

{% block title %}{{ item.topic }} — Admin View{% endblock %}

{% block admin_content %}

<div class="glass-card p-4">
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
        <div>
            <h3 class="mb-1">{{ item.topic }}</h3>
            <small class="text-muted">
                by {{ item.user.username }} &middot; {{ item.created_at|date:"M d, Y - H:i" }}
            </small>
        </div>
        <div>
            <a href="{% url 'admin_history_delete' item.id %}" class="btn btn-outline-danger">
                <i class="bi bi-trash"></i> Delete
            </a>
            <a href="{% url 'admin_history' %}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> Back
            </a>
        </div>
    </div>
    <hr>
    <div class="generated-content">
        {{ rendered|safe }}
    </div>
</div>

{% endblock %}
