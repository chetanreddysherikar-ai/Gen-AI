{% extends 'base.html' %}

{% block content %}
<div class="row fade-in-up g-4">

    <!-- Admin Sidebar -->
    <div class="col-lg-3">
        <div class="glass-card p-4">
            <h5 class="mb-3"><i class="bi bi-shield-lock-fill text-warning"></i> Admin Panel</h5>
            <div class="d-grid gap-2">
                <a href="{% url 'admin_dashboard' %}"
                   class="btn {% if active == 'dashboard' %}btn-primary{% else %}btn-outline-primary{% endif %} text-start">
                    <i class="bi bi-speedometer2"></i> Overview
                </a>
                <a href="{% url 'admin_users' %}"
                   class="btn {% if active == 'users' %}btn-primary{% else %}btn-outline-primary{% endif %} text-start">
                    <i class="bi bi-people-fill"></i> Users
                </a>
                <a href="{% url 'admin_history' %}"
                   class="btn {% if active == 'history' %}btn-primary{% else %}btn-outline-primary{% endif %} text-start">
                    <i class="bi bi-clock-history"></i> Generated Content
                </a>
                <hr>
                <a href="/admin/" target="_blank" class="btn btn-outline-secondary text-start">
                    <i class="bi bi-box-arrow-up-right"></i> Django Admin
                </a>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary text-start">
                    <i class="bi bi-arrow-left"></i> Back to Site
                </a>
            </div>
        </div>
    </div>

    <!-- Admin Content -->
    <div class="col-lg-9">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
