{% extends 'base.html' %}

{% block title %}Verify Email OTP — AI Text Generator{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in-up">
    <div class="col-lg-5">
        <div class="glass-card p-5">

            <div class="text-center mb-4">
                <div class="hero-badge mb-3"><i class="bi bi-shield-check"></i> Security Check</div>
                <h2 class="fw-bold">🔑 Enter OTP Code</h2>
                <p class="text-light">A 6-digit code was sent to <strong>{{ email }}</strong>.</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <input type="hidden" name="email" value="{{ email }}">

                <div class="mb-4">
                    <label class="form-label">6-Digit Verification Code</label>
                    <input type="text" name="otp_code" class="form-control text-center fs-3 letter-spacing-2"
                           placeholder="000000" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" required autofocus>
                </div>

                <button class="btn btn-success btn-lg w-100 mb-3">
                    <i class="bi bi-check-circle-fill"></i> Verify & Login
                </button>
            </form>

            <div class="d-flex justify-content-between mt-3 text-sm">
                <a href="{% url 'request_otp' %}" class="text-info"><i class="bi bi-arrow-clockwise"></i> Resend OTP</a>
                <a href="{% url 'login' %}" class="text-secondary"><i class="bi bi-x-circle"></i> Cancel</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
