{% extends 'base.html' %}

{% block title %}Request Email OTP — AI Text Generator{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in-up">
    <div class="col-lg-5">
        <div class="glass-card p-5">

            <div class="text-center mb-4">
                <div class="hero-badge mb-3"><i class="bi bi-envelope-at"></i> OTP Authentication</div>
                <h2 class="fw-bold">✉️ Email OTP Login</h2>
                <p class="text-light">Enter your registered Email or Username to receive a 6-digit verification code.</p>
            </div>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label">Email Address or Username</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                        <input type="text" name="email_or_username" class="form-control"
                               placeholder="e.g. user@example.com or username" value="{{ email_or_username|default:'' }}" required autofocus>
                    </div>
                </div>

                <button class="btn btn-primary btn-lg w-100 mb-3">
                    <i class="bi bi-send-fill"></i> Send OTP to Email
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-secondary"><i class="bi bi-arrow-left"></i> Back to Password Login</a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
